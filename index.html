    <section class="intro">
      <p>二仙膏一方十六味，配伍之外，更见功夫的是每味药入锅前的处理：黄芪蜜炙，熟地黄以砂仁拌，五味子酒制，沙苑子盐炒，黑芝麻与山药炒过再用，远志制过方入方。</p>
      <p>人参、枸杞子、牛鞭干、制何首乌、牛膝、核桃仁、丹参等亦各依其性处理。同一味药，蜜炙润中、酒制上行、盐炒下行，走向不同，用在哪一处也就不同。</p>
